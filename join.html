<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join the Movement | IZOBO</title><style>:root{--g:#075b40;--r:#ef3037;--ink:#10201a}*{box-sizing:border-box}body{margin:0;background:#f5f8f6;color:var(--ink);font-family:Inter,system-ui,sans-serif}.box{width:min(680px,calc(100% - 28px));margin:60px auto;background:#fff;padding:38px;border-radius:20px;box-shadow:0 18px 60px #0a4f3d18}a{color:var(--g);font-weight:800}h1{color:var(--g);font-size:42px;margin:8px 0}p{line-height:1.6;color:#5b6963}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{font-size:13px;font-weight:800;color:#33433d;display:block;margin:14px 0 7px}input,select{width:100%;padding:14px;border:1px solid #d8e2dd;border-radius:10px;font:inherit}button{margin-top:22px;width:100%;padding:15px;border:0;border-radius:999px;background:var(--r);color:#fff;font-weight:900;font-size:15px;cursor:pointer}.back{font-size:13px}@media(max-width:600px){.box{margin:20px auto;padding:24px}.grid{grid-template-columns:1fr}h1{font-size:34px}}</style></head><body><div class="box"><a class="back" href="index.html">← Back to campaign</a><h1>Join the Movement</h1><p>Register your interest in participating in the IZOBO campaign. We will use the information you provide for campaign coordination.</p><form id="joinForm"><div class="grid"><div><label>Full name</label><input name="name" required autocomplete="name"></div><div><label>Phone number</label><input name="phone" type="tel" required autocomplete="tel"></div></div><label>Email (optional)</label><input name="email" type="email" autocomplete="email"><div class="grid"><div><label>State</label><input name="state" value="Edo State" required></div><div><label>LGA</label><input name="lga" required></div></div><label>How would you like to participate?</label><select name="interest" required><option value="">Select one</option><option>Volunteer</option><option>Campaign supporter</option><option>Community outreach</option><option>Digital/media support</option><option>Other</option></select><button type="submit">Register Interest</button></form><p id="msg" aria-live="polite"></p></div><script>document.getElementById('joinForm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('msg').textContent='Thank you. Your registration form is ready to connect to the campaign database in the next phase.';e.target.querySelector('button').disabled=true;e.target.querySelector('button').textContent='Registered';});</script></body></html>
